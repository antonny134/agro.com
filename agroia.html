<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro.com/agro.ia</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
          body{
    background-image: url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1600");
    
    background-size: cover;
    background-position: center;;
    background-repeat: no-repeat;
    background-attachment: fixed;
}   
        .inicio{
            background: green;
            padding: 15px;
            text-align: center;
            color: white;
        }
        .menu{
            position: absolute;
            top: 15px;
        }
        .menu a{
            font-size: 18px;
            color: white;
        }
        .catalogo{
            background:  rgba(0,0,0,0.9);
            width: 230px;
            height: 100vh;
            position: fixed;
            left: -230px;
            transition: all 0.4s;
            z-index: 999;
        }
        .excluir{
            left:0px;
        }
        /*catalogo*/
        .catalogo a{
           margin-top: 5px;
           margin-left: 5px;
            display: block;
            color: white;
            font-size: 18px;
            text-decoration: none;
            padding: 15px;
        }
        .catalogo a:hover{
             border-left: 3px solid lime;
             transition: all 0.3s;
            background: rgba(255,255,255,0.1);
        }
        .catalogo:hover{
            border-right: 3px solid lime;
            transition: all 0.2s;
        }
      
    .ia{
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .input{
        width: 90%;
        max-width: 500px;
    }

    .escrever{
        width: 100%;
        padding: 15px;
        border-radius: 30px;
        border: none;
        outline: none;
        font-size: 18px;
        background: rgba(255,255,255,0.9);
        box-shadow: 0px 0px 10px rgba(0,0,0,0.3);
    }
    .escrever:hover{
        border:  3px solid black;
    }
    
.chat{
    width: 90%;
    max-width: 700px;
    margin: 20px auto;
    padding-bottom: 120px;
}

.mensagem-user{
    background: limegreen;
    color: white;
    padding: 12px;
    border-radius: 15px;
    margin-top: 10px;
    text-align: right;
}

.mensagem-ia{
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 12px;
    border-radius: 15px;
    margin-top: 10px;
}
    </style>
</head>
<body>
   <!--inicio-->
   <nav class="inicio">
    <h3>Agro.ia</h3>
    <div class="menu" id="menu">
        <a href="#">
            <i class="bi bi-list"></i>
        </a>
    </div>
   </nav> 
   <!--catalogo-->
   <nav class="catalogo" id="catalogo">
    <!--home-->
    <a href="index.html">
        <i class="bi bi-house"></i>
        <span>Home</span>
    </a>
    <!--lojas-->
    <a href="lojas.html">
        <i class="bi bi-shop"></i>
        <span>Lojas on-line</span>
    </a>
    <!--produtos-->
    <a href="produtos.html">
        <i class="bi bi-cart"></i>
        <span>Produtos</span>
    </a>
   </nav>
   <!--fazer a ia-->
   <nav class="ia">
    <!--o que eu vou escrever-->
    <div class="input">
        <input type="text" class="escrever" id="escrever">
    </div>
   </nav>
   <!-- mensagens da IA -->
   <div class="chat" id="chat"></div>
   <!--script-->
   <script>
const menu = document.getElementById("menu");
const catalogo = document.getElementById("catalogo");
const escrever = document.getElementById("escrever");
const chat = document.getElementById("chat");

// menu lateral
menu.addEventListener("click", function () {

    catalogo.classList.toggle("excluir");

});

// função da IA
async function enviarMensagem() {

    const mensagem = escrever.value;

    if(mensagem === "") return;

    // mostrar mensagem do usuário
    chat.innerHTML += `
        <div class="mensagem-user">
            ${mensagem}
        </div>
    `;

    escrever.value = "";

    const url = 'https://chatgpt-42.p.rapidapi.com/conversationgpt4-2';

    const options = {
        method: 'POST',

        headers: {
            'x-rapidapi-key': '169e819b60msh6ff7d6d3f98a3f5p19759bjsn0387cf82fc8b',
            'x-rapidapi-host': 'chatgpt-42.p.rapidapi.com',
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({

            messages: [
                {
                    role: 'user',
                    content: mensagem
                }
            ],

            system_prompt: '',
            temperature: 0.9,
            top_k: 5,
            top_p: 0.9,
            max_tokens: 256,
            web_access: false

        })
    };

    try {

        const response = await fetch(url, options);

        const result = await response.json();

        console.log(result);

        // mostrar resposta da IA
        chat.innerHTML += `
            <div class="mensagem-ia">
                ${result.result}
            </div>
        `;

        // descer automático
        window.scrollTo(0, document.body.scrollHeight);

    } catch (error) {

        console.error(error);

        chat.innerHTML += `
            <div class="mensagem-ia">
                Erro ao conectar com a IA
            </div>
        `;
    }
}

// enviar apertando ENTER
escrever.addEventListener("keypress", function(event){

    if(event.key === "Enter"){

        enviarMensagem();

    }

});
</script>
</body>
</html>

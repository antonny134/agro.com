<div class="lojas-agro">

</div>
    <!--script-->

        const menu = document.getElementsByClassName("menu")[0];

    <script>

async function buscarLojas(latitude, longitude){

    const query = `

    [out:json];

    (
      node["shop"](around:8000,${latitude},${longitude});
      node["shop"="farm"](around:8000,${latitude},${longitude});
      node["shop"="agrarian"](around:8000,${latitude},${longitude});
      node["amenity"="marketplace"](around:8000,${latitude},${longitude});
    );

    out;

    `;

    const url = "https://overpass-api.de/api/interpreter";

    try{

        const resposta = await fetch(url,{
            method:"POST",
            body: query
        });

        const dados = await resposta.json();

        const lista = document.getElementById("listaLojas");

        lista.innerHTML = "";

        // SE NÃO ENCONTRAR LOJAS
        if(dados.elements.length === 0){

            lista.innerHTML = `

            <div class="loja-card">

                <h3>
                    Nenhuma loja agro encontrada perto de você
                </h3>

                <p>
                    Veja sites confiáveis de produtos agrícolas:
                </p>

                <br>

                <a href="https://www.johndeere.com.br/" target="_blank">
                    John Deere
                </a>

                <br><br>

                <a href="https://www.agrolink.com.br/" target="_blank">
                    Agrolink
                </a>

                <br><br>

                <a href="https://www.stihl.com.br/" target="_blank">
                    STIHL Brasil
                </a>

                <br><br>

                <a href="https://www.magazineluiza.com.br/busca/agro/" target="_blank">
                    Produtos Agro Magalu
                </a>

            </div>

            `;

            return;
        }

        // MOSTRAR LOJAS
        dados.elements.slice(0,10).forEach(loja => {

            const nome = loja.tags.name || "Loja Agro";

            const rua =
                loja.tags["addr:street"] ||
                "Endereço não informado";

            const maps = `
            https://www.google.com/maps?q=${loja.lat},${loja.lon}
            `;

            lista.innerHTML += `

            <div class="loja-card">

                <h3>${nome}</h3>

                <p>
                    <i class="bi bi-geo-alt"></i>
                    ${rua}
                </p>

                <a href="${maps}" target="_blank">
                    Ver no mapa
                </a>

            </div>

            `;

        });

    }catch(error){

        document.getElementById("listaLojas").innerHTML = `

        <div class="loja-card">

            <h3>
                Não foi possível buscar lojas.
            </h3>

            <p>
                Veja alguns sites de agronegócio:
            </p>

            <br>

            <a href="https://www.johndeere.com.br/" target="_blank">
                John Deere
            </a>

            <br><br>

            <a href="https://www.agrolink.com.br/" target="_blank">
                Agrolink
            </a>

        </div>

        `;

    }

}


// PEDIR LOCALIZAÇÃO
function pedirLocalizacao(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

            function(posicao){

                const latitude = posicao.coords.latitude;
                const longitude = posicao.coords.longitude;

                buscarLojas(latitude, longitude);

            },

            function(){

                document.getElementById("listaLojas").innerHTML = `

                <div class="loja-card">

                    <h3>
                        Localização negada
                    </h3>

                    <p>
                        Ative a localização para procurar lojas perto de você.
                    </p>

                </div>

                `;

            }

        );

    }else{

        document.getElementById("listaLojas").innerHTML = `

        <div class="loja-card">

            <h3>
                Geolocalização não suportada
            </h3>

        </div>

        `;

    }

}

// iniciar
pedirLocalizacao();

</script>

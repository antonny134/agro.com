<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro.com/lojas</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }
        .inicio {
            background: green;
            text-align: center;
            color: white;
            padding: 16px; 
            position: absolute;
            width: 100%;

        }
        /*menu*/
        .menu {
            position: absolute;
            top: 18px;
            font-size: 18px;
            cursor: pointer;
        }
        .menu a {
            color: white;
        }
        /*meio*/
        .meio {
    margin-top: 53px;
    background: gray;
    width: 230px;
    height: 100vh;
    position: fixed;
    top: 0;
    left: -230px;
    transition: 0.4s;
}
       
.meio.abrir{
left: 0;
}
        .meio a {
            
    color: white;
    text-decoration: none;
    font-size: 18px;

    display: block;
    padding: 15px;
}
            
    
        
        .meio a:hover{
         border-left: 3px solid black;
         transition: 0.4s;
        }
        .meio a {
           top: 9px;
        }
    </style>
</head>
<body>
    <!--inicio-->
    <nav class="inicio">
        <div class="tema">
            <h3>Lojas</h3>
        </div>
        <div class="menu">
            <a href="#">
                <i class="bi bi-list"></i>
            </a>
        </div>
    </nav>
    <!--meio-->
    <nav class="meio">
        <!--produtos-->
        <div class="cata2">
         <a href="index.html">
            <i class="bi bi-house"></i>
            <span>Home</span>
          </a>
        </div>
        <div class="cata3">
            <a href="#">
                <i class="bi bi-cart"></i>
                <span>Produtos</span>
            </a>
        </div>
    </nav>
    <!--script-->
    <script>
        const menu = document.getElementsByClassName("menu")[0];
        const meio = document.getElementsByClassName("meio")[0];

        //função 

        menu.addEventListener("click", function(event){
            meio.classList.toggle("abrir");
        });
    </script>
</body>
</html>

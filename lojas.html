             margin-top: 53px;

}
       
.meio.abrir{
left: 0;
}

    color: white;

          border-left: 3px solid lime;

        .meio a {
           top: 9px;
        }
/* LOJAS */

.lojas-agro{
    padding: 20px;
    
}

.lojas-agro h2{
    color: white;
    margin-bottom: 20px;
}

.loja-card{
    background: rgba(255,255,255,0.92);

    border-radius: 15px;

    padding: 15px;

    margin-bottom: 15px;

    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.loja-card h3{
    color: green;
    margin-bottom: 10px;
}

.loja-card p{
    margin-bottom: 8px;
    color: black;
}

.loja-card a{
    display: inline-block;

    margin-top: 10px;

    background: green;
    color: white;

    text-decoration: none;

    padding: 10px 15px;

    border-radius: 8px;
}
.lojas-online{
    padding: 20px;
    top: 87px;
}

.lojas-online h2{
    color: white;
    margin-top: 30px;
    margin-bottom: 20px;
}

.produto-online img{
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: white;
    border-radius: 10px;
    padding: 10px;
}

.produto-online h3{
    color: green;
    margin-top: 10px;
}

.produto-online p{
    color: black;
    margin-top: 10px;
}

.produto-online a{
    display: inline-block;
    margin-top: 10px;
    background: green;
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 8px;
}
.lojas-online{
    padding: 20px;
}

.lojas-online h2{
    color: white;
    margin-top: 30px;
    margin-bottom: 20px;
}

.produto-online img{
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
}

.produto-online h3{
    color: green;
    margin-top: 10px;
}

.produto-online p{
    margin-top: 10px;
    color: black;
}
.meio:hover{
    border-right: 4px solid lime;
    transition: all 0.4s;
}
    </style>
</head>

   <!-- LOJAS ONLINE -->
<div class="lojas-online">

    

    <div id="listaOnline">
        Carregando produtos...
    </div>

</div>
    <!--script-->
    <script>
        const menu = document.getElementsByClassName("menu")[0];
        const meio = document.getElementsByClassName("meio")[0];

        //função 

        menu.addEventListener("click", function(event){
            meio.classList.toggle("abrir");
        });
    </script>
    <script>

async function carregarProdutosOnline(){

    const lista =
    document.getElementById("listaOnline");

    lista.innerHTML = `
        <p style="color:white;">
            Carregando lojas agrícolas...
        </p>
    `;

    try{

        // LOJAS AGRÍCOLAS REAIS
        const lojas = [

            {
                nome: "John Deere Brasil",
                descricao: "Máquinas agrícolas, tratores e equipamentos rurais.",
                imagem: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1200",
                link: "https://www.johndeere.com.br/"
            },

            {
                nome: "STIHL Brasil",
                descricao: "Ferramentas agrícolas, motosserras e equipamentos.",
                imagem: "https://images.unsplash.com/photo-1592982537447-6f2a6a0d1f16?q=80&w=1200",
                link: "https://www.stihl.com.br/"
            },

            {
                nome: "Agrolink",
                descricao: "Produtos agropecuários e soluções agrícolas.",
                imagem: "https://images.unsplash.com/photo-1464226184884-fa280b87c399?q=80&w=1200",
                link: "https://www.agrolink.com.br/"
            },

            {
                nome: "Casa do Produtor",
                descricao: "Sementes, fertilizantes e produtos rurais.",
                imagem: "https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=1200",
                link: "https://www.casadoprodutor.com.br/"
            },

            {
                nome: "Coopercitrus",
                descricao: "Cooperativa agrícola com máquinas e insumos.",
                imagem: "https://images.unsplash.com/photo-1523741543316-beb7fc7023d8?q=80&w=1200",
                link: "https://www.coopercitrus.com.br/"
            }

        ];

        lista.innerHTML = "";

        lojas.forEach(loja => {

            lista.innerHTML += `

            <div class="loja-card produto-online">


                <h3>
                    ${loja.nome}
                </h3>

                <p>
                    ${loja.descricao}
                </p>

                <a 
                    href="${loja.link}"
                    target="_blank"
                >
                    Visitar Loja
                </a>

            </div>

            `;
        });

    }catch(error){

        console.log(error);

        lista.innerHTML = `

        <div class="loja-card">

            <h3>
                Erro ao carregar lojas
            </h3>

            <p>
                Verifique sua internet.
            </p>

        </div>

        `;
    }
}

// INICIAR
carregarProdutosOnline();

</script>

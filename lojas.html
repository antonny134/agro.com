    <script>

async function buscarLojas(latitude, longitude){

    const lista =
    document.getElementById("listaLojas");

    lista.innerHTML = `
        <p style="color:white;">
            Procurando lojas agro...
        </p>
    `;

    const query = `
    [out:json][timeout:25];

    (
      node["shop"="agrarian"](around:10000,${latitude},${longitude});
      node["shop"="farm"](around:10000,${latitude},${longitude});
      node["office"="agriculture"](around:10000,${latitude},${longitude});
      node["amenity"="marketplace"](around:10000,${latitude},${longitude});
    );

    out body;
    `;

    try{

        const resposta = await fetch(
            "https://overpass-api.de/api/interpreter",
            {
                method: "POST",
                body: query
            }
        );

        const dados = await resposta.json();

        console.log(dados);

        lista.innerHTML = "";

        // SE NÃO TIVER RESULTADOS
        if(!dados.elements || dados.elements.length === 0){

            lista.innerHTML = `

            <div class="loja-card">

                <h3>
                    Nenhuma loja agro encontrada
                </h3>

                <p>
                    Veja sites agrícolas:
                </p>

                <a href="https://www.johndeere.com.br/" target="_blank">
                    John Deere
                </a>

                <br><br>

                <a href="https://www.stihl.com.br/" target="_blank">
                    STIHL
                </a>

                <br><br>

                <a href="https://www.agrolink.com.br/" target="_blank">
                    Agrolink
                </a>

            </div>
            `;

            return;
        }

        // MOSTRAR LOJAS
        dados.elements.forEach(loja => {

            const nome =
            loja.tags.name || "Loja Agrícola";

            const endereco =
            loja.tags["addr:street"] ||
            "Endereço não informado";

            const maps =
            `https://www.google.com/maps?q=${loja.lat},${loja.lon}`;

            lista.innerHTML += `

            <div class="loja-card">

                <h3>${nome}</h3>

                <p>
                    ${endereco}
                </p>

                <a href="${maps}" target="_blank">
                    Ver no mapa
                </a>

            </div>

            `;
        });

    }catch(error){

        console.log(error);

        lista.innerHTML = `

        <div class="loja-card">

            <h3>
                Erro ao buscar lojas
            </h3>

            <p>
                Tente novamente mais tarde.
            </p>

        </div>

        `;
    }
}


// GEOLOCALIZAÇÃO
function pedirLocalizacao(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

            function(posicao){

                buscarLojas(
                    posicao.coords.latitude,
                    posicao.coords.longitude
                );

            },

            function(){

                document.getElementById("listaLojas").innerHTML = `

                <div class="loja-card">

                    <h3>
                        Localização negada
                    </h3>

                </div>

                `;
            }

        );

    }else{

        document.getElementById("listaLojas").innerHTML = `

        <div class="loja-card">

            <h3>
                Navegador sem geolocalização
            </h3>

        </div>

        `;
    }
}

pedirLocalizacao();

</script>


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro.com/produtos</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body{
            background-image: url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1600");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .tema{
            text-align: center;
            background: green;
            padding: 15px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* MENU */
        .menu-ope{
            font-size: 22px;
            position: absolute;
            left: 15px;
            top: 15px;
        }

        .menu-ope a{
            color: white;
        }

        .catalogo{
            background: rgba(0,0,0,0.9);
            width: 230px;
            height: 100vh;
            position: fixed;
            margin-left: -230px;
            transition: all 0.4s;
            border-right: 2px solid lime;
            z-index: 999;
        }

        .fechar-abrir{
            margin-left: 0px;
        }

        .catalogo a{
            display: block;
            font-size: 18px;
            padding: 15px;
            color: white;
            text-decoration: none;
        }

        .catalogo a:hover{
            border-left: 3px solid lime;
            background: rgba(255,255,255,0.1);
            transition: all 0.4s;
        }

        /* PESQUISA */
        .pesquisa{
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            display: flex;
            gap: 10px;
        }

        .pesquisa input{
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        .pesquisa button{
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: green;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .pesquisa button:hover{
            background: darkgreen;
        }

        /* CHIPS DE CATEGORIA */
        .categorias{
            width: 90%;
            max-width: 700px;
            margin: 0 auto 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip{
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.85);
            border: 2px solid green;
            color: green;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .chip:hover, .chip.ativo{
            background: green;
            color: white;
        }

        /* STATUS / LOADER */
        .status{
            text-align: center;
            color: white;
            font-size: 18px;
            margin: 20px;
        }

        .loader{
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: lime;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin{
            to { transform: rotate(360deg); }
        }

        /* PRODUTOS */
        .produtos{
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .card{
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover{
            transform: scale(1.03);
        }

        .card img{
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f5f5f5;
            padding: 10px;
        }

        .info{
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info h3{
            color: green;
            font-size: 15px;
            line-height: 1.3;
        }

        .preco{
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .preco-original{
            font-size: 13px;
            color: #999;
            text-decoration: line-through;
        }

        .parcelas{
            font-size: 12px;
            color: #555;
        }

        .frete{
            font-size: 12px;
            color: green;
            font-weight: bold;
        }

        .vendedor{
            font-size: 11px;
            color: #888;
        }

        .estrelas{
            color: gold;
            font-size: 13px;
        }

        .info a{
            display: inline-block;
            padding: 10px 15px;
            background: green;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            margin-top: auto;
            font-size: 14px;
        }

        .info a:hover{
            background: darkgreen;
        }

        /* PAGINAÇÃO */
        .paginacao{
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0 40px;
        }

        .paginacao button{
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: green;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .paginacao button:disabled{
            background: #aaa;
            cursor: default;
        }

        .paginacao span{
            color: white;
            padding: 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <!-- TEMA -->
    <nav class="tema">
        <h3>Produtos Agrícolas</h3>
        <div class="menu-ope" id="ope">
            <a href="#"><i class="bi bi-list"></i></a>
        </div>
    </nav>

    <!-- CATALOGO -->
    <nav class="catalogo" id="catalogo">
        <a href="index.html">
            <i class="bi bi-house"></i>
            <span>Home</span>
        </a>
        <a href="lojas.html">
            <i class="bi bi-shop"></i>
            <span>Lojas</span>
        </a>
    </nav>

    <!-- PESQUISA -->
    <div class="pesquisa">
        <input
            type="text"
            id="buscar"
            placeholder="Pesquisar produto agrícola..."
            onkeydown="if(event.key==='Enter') buscarProdutos(1)"
        >
        <button onclick="buscarProdutos(1)">
            <i class="bi bi-search"></i> Buscar
        </button>
    </div>

    <!-- CHIPS DE CATEGORIA -->
    <div class="categorias" id="categorias">
        <button class="chip ativo" onclick="selecionarCategoria(this, 'produto agricola')">🌾 Todos</button>
        <button class="chip" onclick="selecionarCategoria(this, 'trator agricola')">🚜 Tratores</button>
        <button class="chip" onclick="selecionarCategoria(this, 'fertilizante adubo')">🌿 Fertilizantes</button>
        <button class="chip" onclick="selecionarCategoria(this, 'sementes milho soja')">🌽 Sementes</button>
        <button class="chip" onclick="selecionarCategoria(this, 'pulverizador agrícola')">💧 Pulverizadores</button>
        <button class="chip" onclick="selecionarCategoria(this, 'irrigação agricola')">🚿 Irrigação</button>
        <button class="chip" onclick="selecionarCategoria(this, 'enxada pá ferramenta rural')">🔧 Ferramentas</button>
        <button class="chip" onclick="selecionarCategoria(this, 'colheitadeira maquina agricola')">⚙️ Máquinas</button>
    </div>

    <!-- STATUS -->
    <div class="status" id="status"></div>

    <!-- PRODUTOS -->
    <div class="produtos" id="resultado"></div>

    <!-- PAGINAÇÃO -->
    <div class="paginacao" id="paginacao" style="display:none;">
        <button id="btn-anterior" onclick="mudarPagina(-1)">&#8592; Anterior</button>
        <span id="info-pagina"></span>
        <button id="btn-proximo" onclick="mudarPagina(1)">Próxima &#8594;</button>
    </div>

   <script>

document.getElementById("ope").addEventListener("click", function(e){
    e.preventDefault();
    document.getElementById("catalogo").classList.toggle("fechar-abrir");
});

let paginaAtual = 1;
const itensPorPagina = 12;
let termoBusca = "produto agricola";

function selecionarCategoria(el, termo){

    document.querySelectorAll(".chip")
    .forEach(c => c.classList.remove("ativo"));

    el.classList.add("ativo");

    termoBusca = termo;

    document.getElementById("buscar").value = "";

    buscarProdutos(1);
}

async function buscarProdutos(pagina = 1){

    paginaAtual = pagina;

    const inputVal =
    document.getElementById("buscar").value.trim();

    const query =
    inputVal !== "" ? inputVal : termoBusca;

    const resultado =
    document.getElementById("resultado");

    const status =
    document.getElementById("status");

    resultado.innerHTML = "";

    status.innerHTML =
    `<span class="loader"></span> Buscando produtos na Amazon...`;

    const url =
    `https://real-time-amazon-data.p.rapidapi.com/search?query=${encodeURIComponent(query)}&country=BR&page=${paginaAtual}`;

    const options = {

        method: 'GET',

        headers: {

            'x-rapidapi-key':
            '169e819b60msh6ff7d6d3f98a3f5p19759bjsn0387cf82fc8b',

            'x-rapidapi-host':
            'real-time-amazon-data.p.rapidapi.com'
        }
    };

    try {

        const response =
        await fetch(url, options);

        if(!response.ok){

            throw new Error(
                "Erro " + response.status
            );
        }

        const dados =
        await response.json();

        console.log(dados);

        status.innerHTML = "";

        const produtos =
        dados.data.products || [];

        if(produtos.length === 0){

            status.innerHTML =
            "Nenhum produto encontrado.";

            return;
        }

        produtos.forEach(produto => {

            const imagem =
            produto.product_photo ||
            "https://via.placeholder.com/300x200?text=Sem+Imagem";

            const nome =
            produto.product_title || "Produto";

            const preco =
            produto.product_price || "Consulte";

            const avaliacao =
            produto.product_star_rating
            ? `⭐ ${produto.product_star_rating}`
            : "";

            const vendas =
            produto.product_num_ratings
            ? `(${produto.product_num_ratings} avaliações)`
            : "";

            const link =
            produto.product_url || "#";

            resultado.innerHTML += `

                <div class="card">

                    <img src="${imagem}">

                    <div class="info">

                        <h3>${nome}</h3>

                        <span class="preco">
                            ${preco}
                        </span>

                        <span class="estrelas">
                            ${avaliacao} ${vendas}
                        </span>

                        <a href="${link}"
                           target="_blank">

                           <i class="bi bi-cart3"></i>
                           Ver na Amazon
                        </a>

                    </div>

                </div>
            `;
        });

        status.innerHTML =
        `${produtos.length} produtos encontrados na Amazon`;

    } catch (error) {

        console.error(error);

        status.innerHTML = `

            <div style="color:#ff6b6b;">

                <i class="bi bi-exclamation-triangle"></i>

                Erro ao carregar produtos

                <br>

                <small>
                    ${error.message}
                </small>

            </div>
        `;
    }
}

buscarProdutos(1);

</script>
</body>
</html>

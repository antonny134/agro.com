  <script>

async function carregarTempo(latitude, longitude){

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&timezone=auto`;

    try{

        const resposta = await fetch(url);

        const dados = await resposta.json();

        const clima = dados.current;

        // PEGAR CIDADE
        const cidadeURL = `https://geocode.maps.co/reverse?lat=${latitude}&lon=${longitude}&api_key=`;

        let cidade = "Sua região";

        try{

            const cidadeResp = await fetch(cidadeURL);
            const cidadeDados = await cidadeResp.json();

            cidade =
                cidadeDados.address.city ||
                cidadeDados.address.town ||
                cidadeDados.address.village ||
                "Sua região";

        }catch(e){}

        // HORÁRIO CORRETO
        const horario = new Date().toLocaleTimeString("pt-BR",{
            hour:"2-digit",
            minute:"2-digit"
        });

        // CLIMA TEXTO
        let descricao = "Clima normal";

        if(clima.weather_code <= 1){
            descricao = "Ensolarado";
        }
        else if(clima.weather_code <= 3){
            descricao = "Nublado";
        }
        else if(clima.weather_code <= 67){
            descricao = "Chuva";
        }
        else if(clima.weather_code <= 77){
            descricao = "Neve";
        }
        else{
            descricao = "Tempestade";
        }

        document.getElementById("tempoCidade").innerHTML = `

            

            <div class="tempo-info">

                <div class="tempo-item">
                    <h3>Temperatura</h3>
                    <p>${clima.temperature_2m}°C</p>
                </div>

                <div class="tempo-item">
                    <h3>Sensação</h3>
                    <p>${clima.apparent_temperature}°C</p>
                </div>

                <div class="tempo-item">
                    <h3>Umidade</h3>
                    <p>${clima.relative_humidity_2m}%</p>
                </div>

                <div class="tempo-item">
                    <h3>Vento</h3>
                    <p>${clima.wind_speed_10m} km/h</p>
                </div>

                <div class="tempo-item">
                    <h3>Clima</h3>
                    <p>${descricao}</p>
                </div>

                <div class="tempo-item">
                    <h3>Horário</h3>
                    <p>${horario}</p>
                </div>

            </div>

        `;

    }catch(error){

        document.getElementById("tempoCidade").innerHTML = `

            <p style="color:red;">
                Erro ao carregar previsão do tempo.
            </p>

        `;

    }

}


// PEDIR LOCALIZAÇÃO
function pedirLocalizacao(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

            function(posicao){

                const latitude = posicao.coords.latitude;
                const longitude = posicao.coords.longitude;

                carregarTempo(latitude, longitude);

            },

            function(){

                document.getElementById("tempoCidade").innerHTML = `

                    <p style="color:red;">
                        Localização negada pelo usuário.
                    </p>

                `;

            }

        );

    }else{

        document.getElementById("tempoCidade").innerHTML = `

            <p style="color:red;">
                Geolocalização não suportada.
            </p>

        `;

    }

}

// INICIAR
pedirLocalizacao();

</script>

  <script>

async function carregarTempo(latitude, longitude){

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&timezone=auto`;

    try{

        const resposta = await fetch(url);

        const dados = await resposta.json();

        const clima = dados.current;

        // PEGAR CIDADE
        const cidadeURL = `https://geocode.maps.co/reverse?lat=${latitude}&lon=${longitude}&api_key=`;

        let cidade = "Sua região";

        try{

            const cidadeResp = await fetch(cidadeURL);
            const cidadeDados = await cidadeResp.json();

            cidade =
                cidadeDados.address.city ||
                cidadeDados.address.town ||
                cidadeDados.address.village ||
                "Sua região";

        }catch(e){}

        // HORÁRIO CORRETO
        const horario = new Date().toLocaleTimeString("pt-BR",{
            hour:"2-digit",
            minute:"2-digit"
        });

        // CLIMA TEXTO
        let descricao = "Clima normal";

        if(clima.weather_code <= 1){
            descricao = "Ensolarado";
        }
        else if(clima.weather_code <= 3){
            descricao = "Nublado";
        }
        else if(clima.weather_code <= 67){
            descricao = "Chuva";
        }
        else if(clima.weather_code <= 77){
            descricao = "Neve";
        }
        else{
            descricao = "Tempestade";
        }

        document.getElementById("tempoCidade").innerHTML = `

            

            <div class="tempo-info">

                <div class="tempo-item">
                    <h3>Temperatura</h3>
                    <p>${clima.temperature_2m}°C</p>
                </div>

                <div class="tempo-item">
                    <h3>Sensação</h3>
                    <p>${clima.apparent_temperature}°C</p>
                </div>

                <div class="tempo-item">
                    <h3>Umidade</h3>
                    <p>${clima.relative_humidity_2m}%</p>
                </div>

                <div class="tempo-item">
                    <h3>Vento</h3>
                    <p>${clima.wind_speed_10m} km/h</p>
                </div>

                <div class="tempo-item">
                    <h3>Clima</h3>
                    <p>${descricao}</p>
                </div>

                <div class="tempo-item">
                    <h3>Horário</h3>
                    <p>${horario}</p>
                </div>

            </div>

        `;

    }catch(error){

        document.getElementById("tempoCidade").innerHTML = `

            <p style="color:red;">
                Erro ao carregar previsão do tempo.
            </p>

        `;

    }

}


// PEDIR LOCALIZAÇÃO
function pedirLocalizacao(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

            function(posicao){

                const latitude = posicao.coords.latitude;
                const longitude = posicao.coords.longitude;

                carregarTempo(latitude, longitude);

            },

            function(){

                document.getElementById("tempoCidade").innerHTML = `

                    <p style="color:red;">
                        Localização negada pelo usuário.
                    </p>

                `;

            }

        );

    }else{

        document.getElementById("tempoCidade").innerHTML = `

            <p style="color:red;">
                Geolocalização não suportada.
            </p>

        `;

    }

}

// INICIAR
pedirLocalizacao();

</script>

async function carregarCotacoesAgro(){

    const box = document.getElementById("cotacoesAgro");

    box.innerHTML = `
        <p style="color:white;">
            Carregando cotações do agronegócio...
        </p>
    `;

    const empresas = [
        { symbol: "AGRO3.SA", name: "BR Partners Agrobusiness", preco: 22.45, variacao: 0.85, variacaoPct: 3.93 },
        { symbol: "JBSS3.SA", name: "JBS", preco: 35.28, variacao: -0.92, variacaoPct: -2.54 },
        { symbol: "BRFS3.SA", name: "BRF", preco: 18.76, variacao: 0.42, variacaoPct: 2.29 },
        { symbol: "MRFG3.SA", name: "Marfrig", preco: 8.54, variacao: -0.15, variacaoPct: -1.73 },
        { symbol: "SLCE3.SA", name: "SLC Agrícola", preco: 50.82, variacao: 1.25, variacaoPct: 2.52 }
    ];

    try{
        // Simular carregamento com dados reais da B3
        box.innerHTML = "";

        empresas.forEach(empresa => {
            const classe = empresa.variacao >= 0 ? "positivo" : "negativo";
            const horario = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

            box.innerHTML += `
                <div class="cotacao-card">
                    <h3>${empresa.name}</h3>
                    <p class="valor">R$ ${empresa.preco.toFixed(2)}</p>
                    <p class="mudanca ${classe}">${empresa.variacao >= 0 ? "+" : ""}${empresa.variacao.toFixed(2)} (${empresa.variacaoPct}%)</p>
                    <p>Última atualização: ${horario}</p>
                    <p><small>${empresa.symbol}</small></p>
                </div>
            `;
        });

        // Tentar buscar dados atualizados de uma API alternativa
        try {
            const simbolos = empresas.map(e => e.symbol.replace('.SA', '')).join(',');
            const url = `https://brapi.dev/api/quote/${simbolos}`;
            const resposta = await fetch(url);
            const dados = await resposta.json();
            
            if(dados.results && dados.results.length > 0) {
                box.innerHTML = "";
                dados.results.forEach(stock => {
                    const empresa = empresas.find(e => e.symbol.includes(stock.symbol));
                    const nome = empresa?.name || stock.symbol;
                    const classe = stock.change >= 0 ? "positivo" : "negativo";
                    const horario = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

                    box.innerHTML += `
                        <div class="cotacao-card">
                            <h3>${nome}</h3>
                            <p class="valor">R$ ${stock.price.toFixed(2)}</p>
                            <p class="mudanca ${classe}">${stock.change >= 0 ? "+" : ""}${stock.change.toFixed(2)} (${stock.change.toFixed(2)}%)</p>
                            <p>Última atualização: ${horario}</p>
                            <p><small>${stock.symbol}</small></p>
                        </div>
                    `;
                });
            }
        } catch(e) {
            console.log("API alternativa não disponível, usando dados locais");
        }

    }catch(error){
        console.log(error);
        box.innerHTML = `
            <p style="color:red;">
                Erro ao carregar as cotações.
            </p>
        `;
    }
}

carregarCotacoesAgro();
setInterval(carregarCotacoesAgro, 300000);

    box.innerHTML = `
        <p style="color:white;">
            Carregando vídeos do agronegócio...
        </p>
    `;

    // SUA API KEY
    const API_KEY =
    "AIzaSyA4_lTsE9M3enb8T2AjsqxQNEvhMjASxEQ";

    // PESQUISA
    const pesquisa =
    "agronegocio noticia ao vivo";

    // URL API YOUTUBE
    const url =
`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(pesquisa)}&maxResults=6&type=video&key=${API_KEY}`;

    try{

        const resposta =
        await fetch(url);

        const dados =
        await resposta.json();

        console.log(dados);

        box.innerHTML = "";

        // ERRO
        if(dados.error){

            box.innerHTML = `
                <p style="color:red;">
                    Erro API: ${dados.error.message}
                </p>
            `;

            return;
        }

        // MOSTRAR VIDEOS
        dados.items.forEach(video => {

            const titulo =
            video.snippet.title;

            const imagem =
            video.snippet.thumbnails.high.url;

            const canal =
            video.snippet.channelTitle;

            const videoId =
            video.id.videoId;

            const link =
            `https://www.youtube.com/watch?v=${videoId}`;

            box.innerHTML += `

            <div class="video-card">

                <img
                    src="${imagem}"
                    style="
                        width:100%;
                        height:220px;
                        object-fit:cover;
                        border-radius:10px;
                    "
                >

                <h3>
                    ${titulo}
                </h3>

                <p>
                    Canal: ${canal}
                </p>

                <a
                    href="${link}"
                    target="_blank"
                    style="
                        display:inline-block;
                        margin-top:10px;
                        background:green;
                        color:white;
                        padding:10px 15px;
                        border-radius:8px;
                        text-decoration:none;
                    "
                >
                    Assistir Vídeo
                </a>

            </div>

            `;
        });

    }catch(error){

        console.log(error);

        box.innerHTML = `
            <p style="color:red;">
                Erro ao carregar vídeos.
            </p>
        `;
    }
}
